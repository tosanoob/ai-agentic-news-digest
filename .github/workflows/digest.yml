name: Agentic Digest
on:
  schedule:
    - cron: '37 23 * * *' # 06:37 Asia/Ho_Chi_Minh; collection only.
  push:
    branches: [main]
    paths: ['editorial/*.json']
  pull_request:
    paths:
      - '.github/workflows/digest.yml'
      - 'scripts/digest_actions.py'
      - 'tests/test_digest_actions.py'
      - 'scripts/archive_candidates.py'
      - 'scripts/push_candidates.sh'
      - 'tests/test_candidate_archive.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collect source candidates, validate a reviewed bundle, or publish it'
        type: choice
        options: [collect, dry-run, publish]
        default: collect
      bundle:
        description: 'Reviewed bundle JSON; required for dry-run and publish'
        type: string
        required: false
permissions:
  contents: read
jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch candidate feeds
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-artifact"
          python scripts/digest_actions.py collect \
            --output "$RUNNER_TEMP/candidate-artifact/digest-candidates.json" \
            --raw-output "$RUNNER_TEMP/candidate-artifact/raw-candidates.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: digest-candidates-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-artifact/
          if-no-files-found: error
          retention-days: 3
  log_candidates:
    needs: collect
    if: always() && github.ref == 'refs/heads/main' && (needs.collect.result == 'success' || needs.collect.result == 'failure')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: digest-candidates-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-artifact/
      - name: Persist pre-editorial metadata to the candidate branch
        run: bash scripts/push_candidates.sh candidate-log
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
      - name: Validate reviewed bundle without writing files to the checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST_BUNDLE: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          test -n "$DIGEST_BUNDLE"
          printf '%s' "$DIGEST_BUNDLE" > "$RUNNER_TEMP/digest-bundle.json"
          python scripts/digest_actions.py apply --dry-run "$RUNNER_TEMP/digest-bundle.json"
          test -z "$(git status --porcelain --untracked-files=no)"
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    permissions:
      contents: write
    concurrency:
      group: digest-ledger-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and publish one reviewed bundle
        env:
          DIGEST_BUNDLE: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach FETCH_HEAD
          python -m unittest discover -s tests -v
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            before="$(jq -r .before "$GITHUB_EVENT_PATH")"
            mapfile -t files < <(git diff --diff-filter=AM --name-only "$before" "$GITHUB_SHA" -- 'editorial/*.json')
            test "${#files[@]}" -eq 1
            path="${files[0]}"
            [[ "$path" =~ ^editorial/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]
            git show "$GITHUB_SHA:$path" > "$RUNNER_TEMP/digest-bundle.json"
            filename="${path##*/}"
            python scripts/digest_actions.py apply "$RUNNER_TEMP/digest-bundle.json" --expected-date "${filename%.json}"
          else
            test -n "$DIGEST_BUNDLE"
            printf '%s' "$DIGEST_BUNDLE" > "$RUNNER_TEMP/digest-bundle.json"
            python scripts/digest_actions.py apply "$RUNNER_TEMP/digest-bundle.json"
          fi
          python scripts/ledger.py validate
          git add -- articles digests data/stories.jsonl
          if git diff --cached --quiet; then
            echo 'NOOP: bundle already archived' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'digest: archive reviewed news and ledger'
          git push origin HEAD:refs/heads/main
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          echo "SYNCED: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
